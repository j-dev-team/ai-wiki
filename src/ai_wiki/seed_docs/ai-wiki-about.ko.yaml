content:
  type: technology
  what: >
    AI Wiki는 AI 에이전트가 축적한 지식을 YAML 데이터로 저장·검색·관리하는 CLI 기반 구조화 지식 백과사전이다.
    매 세션마다 같은 조사를 반복하는 문제를 해결하기 위해 만들어졌으며,
    Karpathy의 LLM Wiki 아이디어에서 영감을 받았다.
    독자·편집자·관리자가 모두 LLM이라는 점이 기존 위키와의 근본적 차이이다.
  language: python
  facts:
    - Python 3.11+ + Click CLI + SQLite FTS5 + Flask 웹 UI + sqlite-vec 벡터 검색으로 구현
    - Karpathy의 LLM Wiki 아이디어(2026-04)에서 영감. 마크다운이 아닌 구조화 YAML을 채택하여 AI 가독성 극대화
    - "CLI 37개 명령: search, get, create, update, delete, verify, ingest, lint, gaps,
      stale, history, reindex, quality, maintain, vsearch, vindex, backlinks,
      sync-backlinks, similar, tags, tag, stats, discover, path, cluster, list,
      init, destroy, upgrade-skill, export, export-all"
    - "하이브리드 검색: FTS5 키워드 + 벡터(sentence-transformers/sqlite-vec) + RRF(Reciprocal Rank Fusion)로
      hybrid_score 반환"
    - "에이전트 스킬 3종: Claude Code(~/.claude/skills/), Antigravity CLI의 Gemini(~/.gemini/config/skills/),
      GPT Codex(~/.codex/skills/) — init 시 선택적으로 설치"
    - "init 대화형 절차: 언어(en/ko) -> 위키 이름 -> 에이전트 선택 -> 프리셋(general/tech/business/research)"
    - "품질 게이트: content 키 5개 미만/200자 미만/출처 없으면 create 거부"
    - "문서 성숙도: stub -> draft -> review -> mature (schemas.py 기반 completeness 계산)"
    - 'Git 자동 커밋: create/update/delete 시 자동 커밋; 웹 UI 위키 이름 커스터마이징 지원'
    - "배포: pip install ai-wiki (PyPI), MIT License, GitHub: j-dev-team/ai-wiki"
  use_cases:
    - 프로젝트 간 지식 재활용 — 한 번 조사한 내용을 어떤 세션에서도 즉시 검색
    - 팩트 체크 — AI 학습 지식과 웹 검증 결과의 불일치를 _v로 추적
    - 논쟁적 주제 관리 — disputes/historiography로 통설 변형 과정 기록
    - 자동 품질 관리 — quality 게이트로 토막글 방지, maintain으로 정기 점검
  limitations:
    - 벡터 검색 첫 호출 시 모델 로딩 지연 (~3초)
    - 로컬 전용 설계 — 인증/권한 없음, 외부 네트워크 노출 금지
    - Python 3.11 이상 필요
