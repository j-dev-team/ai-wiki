[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-wiki"
version = "0.4.0"
description = "Structured knowledge wiki CLI for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "flask>=3.0",
    "pydantic>=2.8,<3",
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.0",
]

[project.urls]
Homepage = "https://github.com/j-dev-team/ai-wiki"
Repository = "https://github.com/j-dev-team/ai-wiki"

[project.scripts]
ai-wiki = "ai_wiki.cli:cli"
ai-wiki-web = "ai_wiki.web:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_wiki = ["skill_templates/*.md", "seed_docs/*.yaml", "templates/*.html", "static/*", "variant_presets/*.yaml"]
